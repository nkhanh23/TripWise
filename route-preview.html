<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-md antialiased relative flex flex-col">
<!-- Top Navigation Canvas - Back Button Context -->
<div class="fixed top-0 w-full z-50 flex items-center px-lg h-16 pointer-events-auto">
<button class="w-10 h-10 rounded-full bg-surface shadow-md flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</div>
<!-- Map Canvas Level 0 -->
<div class="map-container" data-alt="A clean, modern top-down map interface showing a city route from point A to point B. The map style is minimalist, using a soft, light color palette of subtle greys, whites, and pale blues for water. A distinct, bright blue route line connects a circular origin marker to a destination pin. The aesthetic is highly corporate, clean, and navigation-focused, with no clutter or distracting labels. Soft ambient lighting." data-location="Bangkok" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCS9dEU9kfvnVx2jXXvJ6VTBFHdaIKE8owxPdKdaPF4ajdicebMrRww4Z2Y6zIZA8BV9h0zLikPky7ihGZDvrQAYVGvEEZYwDVye8UNPknSwbaG1MGjqHUIoCRx84DQH1prK-OnWtsAHqZBm1lWxE3E0DChjDXF86SQOSHZzw9noPeTTcqfkq8jZK74DDifF6oCM9PCDSmI-6qlH7iwAxpmH0Hn51DhCWBlV-IzeYTqNMweYLeqyIrltw')">
<!-- SVG Route Overlay Simulation -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 800">
<!-- Simulated Polyline -->
<path d="M 150 500 Q 200 450 180 400 T 250 300 L 220 200" fill="none" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.2))" stroke="#0058bc" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
<!-- Origin Marker -->
<g transform="translate(150, 500)">
<circle cx="0" cy="0" fill="#ffffff" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.3))" r="10"></circle>
<circle cx="0" cy="0" fill="#0058bc" r="4"></circle>
</g>
<!-- Destination Marker -->
<g transform="translate(220, 200)">
<!-- Pin Base -->
<path d="M 0 0 C -8 -8 -12 -16 -12 -24 C -12 -34 -4 -42 4 -42 C 12 -42 20 -34 20 -24 C 20 -16 16 -8 8 0 Z" fill="#ffffff" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.2))" transform="translate(-4, -4)"></path>
<circle cx="0" cy="-28" fill="#bc000a" r="8"></circle>
</g>
</svg>
</div>
<!-- Bottom Sheet Level 2 -->
<div class="absolute bottom-0 w-full bg-surface rounded-t-[24px] shadow-[0_-8px_16px_rgba(0,0,0,0.08)] z-40 flex flex-col pointer-events-auto transform translate-y-0 transition-transform duration-300 ease-in-out pb-safe max-h-[85vh]">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-md pb-xs">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="flex-1 overflow-y-auto no-scrollbar px-lg pb-xl">
<!-- Origin / Destination Inputs Level 1 Surface inside Sheet -->
<div class="bg-surface-container-lowest rounded-lg shadow-[0_4px_8px_rgba(0,0,0,0.04)] p-md mb-lg relative">
<!-- Vertical Connection Line -->
<div class="absolute left-[31px] top-[32px] bottom-[32px] w-[2px] bg-outline-variant/30 border-dashed border-l-2"></div>
<!-- Origin -->
<div class="flex items-center gap-md mb-md relative z-10">
<div class="w-6 flex justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary ring-4 ring-primary/20"></div>
</div>
<div class="flex-1 bg-surface-variant rounded-md px-md py-sm flex items-center focus-within:ring-2 focus-within:ring-primary transition-all">
<input class="w-full bg-transparent border-none p-0 text-body-lg font-body-lg text-on-surface focus:ring-0 placeholder-on-surface-variant" readonly="" type="text" value="Current Location">
</div>
</div>
<!-- Destination -->
<div class="flex items-center gap-md relative z-10">
<div class="w-6 flex justify-center">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex-1 bg-surface-variant rounded-md px-md py-sm flex items-center focus-within:ring-2 focus-within:ring-primary transition-all">
<input class="w-full bg-transparent border-none p-0 text-body-lg font-body-lg text-on-surface focus:ring-0 placeholder-on-surface-variant" readonly="" type="text" value="Siam Paragon">
</div>
</div>
</div>
<!-- Transport Mode Selector (Chips style) -->
<div class="flex overflow-x-auto gap-sm mb-lg pb-xs no-scrollbar">
<!-- Selected: Public Transport -->
<button class="flex items-center gap-xs px-md py-sm rounded-full bg-primary text-on-primary font-label-lg text-label-lg whitespace-nowrap transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">directions_bus</span>
                    Transit
                </button>
<!-- Unselected: Walk -->
<button class="flex items-center gap-xs px-md py-sm rounded-full bg-surface-container-lowest text-on-surface border border-outline-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-low transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">directions_walk</span>
                    Walk
                </button>
<!-- Unselected: Drive -->
<button class="flex items-center gap-xs px-md py-sm rounded-full bg-surface-container-lowest text-on-surface border border-outline-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-low transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">directions_car</span>
                    Drive
                </button>
<!-- Unselected: Ride -->
<button class="flex items-center gap-xs px-md py-sm rounded-full bg-surface-container-lowest text-on-surface border border-outline-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-low transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">local_taxi</span>
                    Ride
                </button>
</div>
<!-- Route Summary Card Level 1 -->
<div class="bg-surface-container-lowest rounded-lg shadow-[0_4px_8px_rgba(0,0,0,0.04)] p-lg mb-xl border border-surface-variant/50">
<div class="flex justify-between items-start mb-md">
<div>
<h3 class="font-display text-display text-primary leading-none mb-xs">17 min</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Fastest route via BTS Sukhumvit Line</p>
</div>
<div class="text-right">
<span class="font-title-md text-title-md text-on-surface">฿45</span>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">4.2 km</p>
</div>
</div>
<!-- Minimal Timeline Representation -->
<div class="flex items-center gap-xs mb-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">directions_walk</span>
<div class="h-1 w-8 bg-outline-variant rounded-full"></div>
<span class="flex items-center justify-center w-6 h-6 rounded bg-[#8DC63F] text-white font-label-md text-[10px]">BTS</span> <!-- Custom color to imply specific line, allowed in specific context but usually stick to theme -->
<div class="h-1 flex-1 bg-outline-variant/30 rounded-full overflow-hidden">
<div class="h-full w-full bg-primary rounded-full"></div>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">directions_walk</span>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary font-title-sm text-title-sm py-lg rounded-full shadow-[0_4px_8px_rgba(0,88,188,0.2)] hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
                Show Options
            </button>
</div>
</div>
</body></html>
