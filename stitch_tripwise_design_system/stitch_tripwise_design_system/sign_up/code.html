<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TripWise - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary-fixed-variant": "#004493",
                        "surface-variant": "#e5e2e1",
                        "outline": "#717786",

                        "surface-container-low": "#f6f3f2",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "tertiary": "#bc000a",
                        "error-container": "#ffdad6",

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f8;
            color: #1c1b1b;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md fixed top-0 w-full z-50 shadow-sm flex justify-between items-center px-lg h-16">
<button aria-label="Go back" class="text-on-surface-variant p-sm rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 text-center">
<h1 class="font-title-lg text-title-lg text-on-surface">Create your account</h1>
</div>
<div class="w-10"></div> <!-- Placeholder for layout balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-24 px-lg pb-3xl flex flex-col max-w-md mx-auto w-full">
<div class="mb-3xl text-center">
<h2 class="font-display text-display text-primary mb-sm">TripWise</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Start your next journey with us.</p>
</div>
<!-- Sign Up Form -->
<form action="#" class="space-y-xl flex-1 flex flex-col" method="POST">
<div class="space-y-lg">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="fullName">Full Name</label>
<input class="bg-surface-variant text-on-surface border-none rounded-lg px-lg py-md focus:ring-2 focus:ring-primary focus:outline-none transition-shadow font-body-lg text-body-lg" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text">
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email</label>
<input class="bg-surface-variant text-on-surface border-none rounded-lg px-lg py-md focus:ring-2 focus:ring-primary focus:outline-none transition-shadow font-body-lg text-body-lg" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<input class="bg-surface-variant text-on-surface border-none rounded-lg px-lg py-md focus:ring-2 focus:ring-primary focus:outline-none transition-shadow font-body-lg text-body-lg" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="confirmPassword">Confirm Password</label>
<input class="bg-surface-variant text-on-surface border-none rounded-lg px-lg py-md focus:ring-2 focus:ring-primary focus:outline-none transition-shadow font-body-lg text-body-lg" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="mt-xl">
<button class="w-full bg-primary text-on-primary font-title-sm text-title-sm py-md rounded-full hover:bg-on-primary-fixed-variant active:scale-95 transition-all duration-200 shadow-md" type="submit">
                    Create account
                </button>
</div>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-2xl">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase">or</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Social Auth -->
<div>
<button class="w-full flex items-center justify-center gap-sm bg-surface text-on-surface border border-outline-variant py-md rounded-full font-title-sm text-title-sm hover:bg-surface-container-low active:scale-95 transition-all duration-200 shadow-sm">
<!-- Using a generic public Google icon placeholder for demo purposes, typically this would be an SVG asset -->
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Footer link -->
<div class="mt-auto pt-3xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-title-sm text-title-sm hover:underline transition-all" href="#">Sign in</a>
</p>
</div>
</main>
<!-- Navigation Shell Suppression: 
         This is a transactional 'Sign Up' screen. The BottomNavBar is intentionally suppressed 
         as per the Semantic Shell Mandate to prioritize the linear user journey. -->
</body></html>
