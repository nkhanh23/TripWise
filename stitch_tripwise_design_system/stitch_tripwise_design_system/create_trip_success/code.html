<style>
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #0058bc; /* primary */
            opacity: 0;
        }

        .success-icon-animation {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .fade-up {
            animation: fadeUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>

                        opacity: 1;

                    100% {

<body class="bg-surface h-full flex flex-col items-center justify-center relative overflow-hidden text-on-surface">
<!-- Confetti Background (Lightweight) -->

<!-- Main Content Canvas -->
<main class="w-full max-w-md px-lg flex flex-col items-center text-center z-10 relative">
<!-- Success Icon (Celebration Area) -->

            </span>
</div>
<!-- Typography -->

            Your Bangkok trip is ready
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-2xl fade-up delay-1 max-w-[280px]">
            Start adding places or explore recommendations.
        </p>
<!-- CTAs -->
<div class="w-full flex flex-col gap-md fade-up delay-2">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-md rounded-full shadow-[0_4px_8px_rgba(0,0,0,0.08)] hover:bg-surface-tint active:scale-95 transition-all duration-200 flex items-center justify-center">
<span class="material-symbols-outlined mr-sm text-[20px]">map</span>

<button class="w-full bg-surface-container-low text-primary font-label-lg text-label-lg py-md rounded-full border border-outline-variant hover:bg-surface-container-highest active:scale-95 transition-all duration-200 flex items-center justify-center">
<span class="material-symbols-outlined mr-sm text-[20px]">explore</span>
                Explore places
            </button>
</div>
<!-- Decorative Map Hint (Subtle Glassmorphism Card) -->
<div class="mt-2xl w-full h-32 rounded-xl bg-surface-variant/30 backdrop-blur-sm border border-outline-variant/30 relative overflow-hidden fade-up delay-2 flex items-center justify-center">
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, #0070eb 0%, transparent 60%);"></div>
<span class="material-symbols-outlined text-primary-fixed-dim text-[48px] opacity-50 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                location_on
            </span>
</div>
</main>
<script>
        // Simple JS for a lightweight confetti effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-bg');
            const colors = ['#0058bc', '#0070eb', '#d8e2ff', '#adc6ff']; // brand primary colors
            
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomize properties
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const animDuration = Math.random() * 2 + 1;
                const delay = Math.random() * 0.5;
                const size = Math.random() * 6 + 4;
                
                confetti.style.backgroundColor = color;
                confetti.style.left = `${left}%`;
                confetti.style.top = '-10px';
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%'; // mix of circles and squares
                
                // Set animation
                confetti.style.animation = `fall ${animDuration}s linear ${delay}s forwards`;
                
                container.appendChild(confetti);
            }
            
            // Add keyframes dynamically
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fall {
                    0% {
                        transform: translateY(0) rotate(0deg);
                        opacity: 1;
                    }
                    100% {
                        transform: translateY(100vh) rotate(360deg);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
