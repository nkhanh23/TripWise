    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary/20 selection:text-primary">
<!-- TopAppBar (Transactional - Back button only) -->
<header class="bg-surface/80 backdrop-blur-md text-primary font-title-lg text-title-lg fixed top-0 w-full z-50 flex items-center px-lg h-16 shadow-sm">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1"></div>
<div class="font-display text-title-lg text-primary">TripWise</div>
<div class="flex-1"></div>
<!-- Spacer to balance back button -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center items-center px-lg pt-24 pb-lg w-full max-w-md mx-auto relative z-10">
<!-- Header Section -->
<div class="w-full mb-3xl text-center">
<h1 class="font-display text-display text-on-surface mb-sm">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to continue planning your trips.</p>
</div>
<!-- Form Section -->
<form class="w-full flex flex-col gap-xl">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full bg-surface-variant text-on-surface placeholder:text-on-surface-variant/50 border-none rounded-lg px-lg py-md focus:ring-2 focus:ring-primary focus:outline-none transition-shadow font-body-md text-body-md" id="email" placeholder="name@example.com" type="email">
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-variant text-on-surface placeholder:text-on-surface-variant/50 border-none rounded-lg px-lg py-md focus:ring-2 focus:ring-primary focus:outline-none transition-shadow font-body-md text-body-md" id="password" placeholder="••••••••" type="password">
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-md px-lg rounded-full shadow-[0_4px_8px_rgba(0,0,0,0.12)] hover:shadow-[0_8px_16px_rgba(0,0,0,0.16)] active:scale-95 transition-all duration-200 mt-sm" type="submit">
                Sign in
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-md my-3xl">
<div class="flex-1 h-[1px] bg-outline-variant/50"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">or</span>
<div class="flex-1 h-[1px] bg-outline-variant/50"></div>
</div>
<!-- Social Login -->
<div class="w-full flex flex-col gap-md mb-3xl">
<button class="w-full bg-surface text-on-surface border border-outline-variant font-label-lg text-label-lg py-md px-lg rounded-full flex items-center justify-center gap-sm hover:bg-surface-container-low active:scale-95 transition-all duration-200" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Footer -->
<p class="font-body-sm text-body-sm text-on-surface-variant mt-auto">
            Don't have an account? 
            <a class="text-primary font-label-md text-label-md hover:underline decoration-primary/50 underline-offset-4 transition-all" href="#">Create one</a>
</p>
</main>
<!-- Bottom Nav suppressed as this is a transactional page -->
</body></html>
