<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>TripWise - Currency Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#d8e4f2",
                        "on-tertiary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fcf9f8",
                        "secondary-fixed-dim": "#bcc8d5",
                        "surface-tint": "#005bc1",
                        "on-primary": "#ffffff",
                        "secondary": "#54606b",
                        "tertiary-fixed": "#ffdad5",
                        "outline-variant": "#c1c6d7",
                        "inverse-on-surface": "#f3f0ef",
                        "primary": "#0058bc",
                        "error": "#ba1a1a",
                        "secondary-container": "#d8e4f2",
                        "surface-container": "#f0eded",
                        "surface": "#fcf9f8",
                        "tertiary-container": "#e2241f",
                        "inverse-surface": "#313030",
                        "on-primary-fixed-variant": "#004493",
                        "surface-variant": "#e5e2e1",
                        "outline": "#717786",
                        "surface-container-high": "#eae7e7",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#5a6671",
                        "surface-container-low": "#f6f3f2",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "tertiary": "#bc000a",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#3d4853",
                        "on-background": "#1c1b1b",
                        "on-surface-variant": "#414755",
                        "on-primary-container": "#fefcff",
                        "background": "#fcf9f8",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#410001",
                        "on-secondary-fixed": "#111d26",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed": "#d8e2ff",
                        "primary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "primary-container": "#0070eb",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "on-tertiary-fixed-variant": "#930005",
                        "on-surface": "#1c1b1b",
                        "inverse-primary": "#adc6ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "16px",
                        "sm": "8px",
                        "3xl": "32px",
                        "2xl": "24px",
                        "xl": "20px",
                        "md": "12px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "title-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "caption": ["Inter"],
                        "title-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "title-sm": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["11px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary/20">
<!-- TopAppBar (Transactional - Hidden main nav shell) -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md fixed top-0 w-full z-50 shadow-sm dark:shadow-none flex justify-between items-center px-lg h-16 transition-colors">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high active:scale-95 duration-150 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface absolute left-1/2 -translate-x-1/2">
            Currency
        </h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-24 px-lg pb-safe flex flex-col gap-2xl max-w-2xl mx-auto w-full">
<!-- Search Section -->
<section class="w-full">
<div class="relative flex items-center w-full bg-surface-variant rounded-full h-14 px-lg transition-all focus-within:ring-2 focus-within:ring-primary shadow-sm hover:shadow-md">
<span class="material-symbols-outlined text-outline mr-sm">search</span>
<input class="bg-transparent border-none outline-none w-full font-body-lg text-on-surface placeholder-outline-variant h-full" placeholder="Search currency or country..." type="text">
</div>
</section>
<!-- Suggested Currencies (Bento Grid Style) -->
<section class="flex flex-col gap-sm">
<h2 class="font-title-sm text-title-sm text-secondary px-xs mb-xs uppercase tracking-wider text-[11px]">Suggested</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
<!-- Selected State Card -->
<button class="flex items-center justify-between p-lg bg-primary/5 border border-primary/20 rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform text-left group">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-title-md text-title-md text-primary shadow-sm group-hover:shadow-md transition-shadow">
                            THB
                        </div>
<div>
<div class="font-title-md text-title-md text-on-surface">Thai Baht</div>
<div class="font-body-sm text-body-sm text-secondary mt-0.5">Thailand</div>
</div>
</div>
<span class="material-symbols-outlined text-primary icon-fill">check_circle</span>
</button>
<!-- Unselected Card -->
<button class="flex items-center justify-between p-lg bg-surface border border-transparent rounded-xl shadow-[0_4px_8px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_16px_rgba(0,0,0,0.06)] hover:bg-surface-container-lowest active:scale-[0.98] transition-all text-left group">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-title-md text-title-md text-on-surface-variant shadow-sm group-hover:bg-surface-container-high transition-colors">
                            USD
                        </div>
<div>
<div class="font-title-md text-title-md text-on-surface">US Dollar</div>
<div class="font-body-sm text-body-sm text-secondary mt-0.5">United States</div>
</div>
</div>
</button>
<!-- Unselected Card -->
<button class="flex items-center justify-between p-lg bg-surface border border-transparent rounded-xl shadow-[0_4px_8px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_16px_rgba(0,0,0,0.06)] hover:bg-surface-container-lowest active:scale-[0.98] transition-all text-left group">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-title-md text-title-md text-on-surface-variant shadow-sm group-hover:bg-surface-container-high transition-colors">
                            VND
                        </div>
<div>
<div class="font-title-md text-title-md text-on-surface">Vietnamese Dong</div>
<div class="font-body-sm text-body-sm text-secondary mt-0.5">Vietnam</div>
</div>
</div>
</button>
<!-- Unselected Card -->
<button class="flex items-center justify-between p-lg bg-surface border border-transparent rounded-xl shadow-[0_4px_8px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_16px_rgba(0,0,0,0.06)] hover:bg-surface-container-lowest active:scale-[0.98] transition-all text-left group">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-title-md text-title-md text-on-surface-variant shadow-sm group-hover:bg-surface-container-high transition-colors">
                            JPY
                        </div>
<div>
<div class="font-title-md text-title-md text-on-surface">Japanese Yen</div>
<div class="font-body-sm text-body-sm text-secondary mt-0.5">Japan</div>
</div>
</div>
</button>
</div>
</section>
<!-- All Currencies List (Glassmorphism inspired list) -->
<section class="flex flex-col gap-sm pb-2xl">
<h2 class="font-title-sm text-title-sm text-secondary px-xs mb-xs uppercase tracking-wider text-[11px]">All Currencies</h2>
<div class="bg-surface rounded-2xl shadow-[0_4px_8px_rgba(0,0,0,0.04)] overflow-hidden divide-y divide-outline-variant/20">
<!-- List Item -->
<button class="w-full flex items-center justify-between p-lg hover:bg-surface-container-lowest active:bg-surface-container-low transition-colors text-left group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">
                            KRW
                        </div>
<div>
<div class="font-body-lg text-body-lg text-on-surface">South Korean Won</div>
</div>
</div>
</button>
<!-- List Item -->
<button class="w-full flex items-center justify-between p-lg hover:bg-surface-container-lowest active:bg-surface-container-low transition-colors text-left group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">
                            SGD
                        </div>
<div>
<div class="font-body-lg text-body-lg text-on-surface">Singapore Dollar</div>
</div>
</div>
</button>
<!-- List Item -->
<button class="w-full flex items-center justify-between p-lg hover:bg-surface-container-lowest active:bg-surface-container-low transition-colors text-left group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">
                            EUR
                        </div>
<div>
<div class="font-body-lg text-body-lg text-on-surface">Euro</div>
</div>
</div>
</button>
<!-- List Item -->
<button class="w-full flex items-center justify-between p-lg hover:bg-surface-container-lowest active:bg-surface-container-low transition-colors text-left group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">
                            GBP
                        </div>
<div>
<div class="font-body-lg text-body-lg text-on-surface">British Pound</div>
</div>
</div>
</button>
</div>
</section>
</main>
<!-- Bottom Nav Bar deliberately suppressed due to Transactional nature of the screen -->
</body></html>
