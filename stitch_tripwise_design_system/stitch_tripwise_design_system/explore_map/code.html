.marker-pin {
    width: 32px;
    height: 32px;
    border-radius: 50% 50% 50% 0;
    background: #fff;
    position: absolute;
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12)
    }
.marker-pin::after {
    content: "";
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #0058bc;
    /* primary */
    }
.marker-content {
    transform: rotate(45deg);
    color: #fff;
    z-index: 10;
    position: absolute
    }
.marker-selected .marker-pin::after {
    background: #e2241f;
    /* tertiary-container */
    transform: scale(1.2);
    transition: transform 0.2s ease
    }
/* Ambient Shadows */
