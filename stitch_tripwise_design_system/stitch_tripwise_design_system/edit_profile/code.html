<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TripWise - Edit Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "inverse-on-surface": "#f3f0ef",
                        "primary": "#0058bc",
                        "error": "#ba1a1a",
                        "secondary-container": "#d8e4f2",
                        "surface-container": "#f0eded",
                        "surface": "#fcf9f8",
                        "tertiary-container": "#e2241f",
                        "inverse-surface": "#313030",
                        "on-primary-fixed-variant": "#004493",
                        "surface-variant": "#e5e2e1",
                        "outline": "#717786",

                        "on-secondary-container": "#5a6671",
                        "surface-container-low": "#f6f3f2",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "tertiary": "#bc000a",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#3d4853",
                        "on-background": "#1c1b1b",

                        "on-tertiary-fixed": "#410001",

                        "primary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "primary-container": "#0070eb",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "on-tertiary-fixed-variant": "#930005",
                        "on-surface": "#1c1b1b",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "16px",
                        "sm": "8px",
                        "3xl": "32px",
                        "2xl": "24px",
                        "xl": "20px",
                        "md": "12px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "title-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "caption": ["Inter"],

                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"]

                    "fontSize": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen pb-20 md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-sm fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-lg h-16 w-full max-w-screen-md mx-auto">
<button aria-label="Go back" class="text-on-surface hover:bg-surface-container-high transition-colors p-sm rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface">Edit profile</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="pt-24 px-lg max-w-screen-md mx-auto space-y-2xl">
<!-- Avatar Section -->
<section class="flex flex-col items-center justify-center space-y-md pt-lg">
<div class="relative w-24 h-24 rounded-full overflow-hidden border-4 border-surface-container shadow-sm">
<img class="object-cover w-full h-full" data-alt="A close-up portrait of a professional traveler smiling slightly, with a soft, natural blurred background. The lighting is bright and modern, conveying a clean and approachable light-mode aesthetic consistent with a premium travel application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz6JwUJ6iD6viQn4-IKf14pHnO9NP9fCDLWagrNfoCmCHTlF1ZrWfpfefsM8FwVmy6Ge9VHsW6W6tXCfef-RL8ITJWt4R2VwwBHaoatefjqp9VeMDv7IuBGzdAcFkWjSOrtdW2G_K-7I5tcBDHyVbS_FgMMlD0zL_53f1096PRKbF6dOxqg5vRYIMR_jdzWxZcJWY-nfLlimfQC3c6MhNK-7DzNjkwZ4URiFwYPBwL1_1xJHRjfQtWeQ">
</div>
<button class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors active:scale-95 duration-150">
                Change photo
            </button>
</section>
<!-- Form Section -->
<section class="space-y-xl bg-surface-container-low rounded-xl p-lg shadow-[0_4px_16px_rgba(0,0,0,0.04)]">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block px-xs" for="fullName">Full name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10" data-icon="person">person</span>
<input class="w-full bg-surface-variant text-on-surface font-body-md border-0 rounded-lg py-md pl-3xl pr-md focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-outline" id="fullName" placeholder="Enter your full name" type="text" value="Alex Rivera">
</div>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block px-xs" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10" data-icon="mail">mail</span>
<input class="w-full bg-surface-variant text-on-surface font-body-md border-0 rounded-lg py-md pl-3xl pr-md focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-outline" id="email" placeholder="Enter your email" type="email" value="alex.rivera@example.com">
</div>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block px-xs" for="homeCountry">Home country</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10" data-icon="public">public</span>
<select class="w-full bg-surface-variant text-on-surface font-body-md border-0 rounded-lg py-md pl-3xl pr-md focus:ring-2 focus:ring-primary focus:bg-surface transition-all appearance-none" id="homeCountry">
<option value="us">United States</option>
<option value="ca">Canada</option>
<option value="uk">United Kingdom</option>
<option value="au">Australia</option>
<option value="sg">Singapore</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</section>
<!-- CTA Section -->
<section class="pt-lg pb-3xl">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg rounded-full py-md px-lg shadow-[0_4px_12px_rgba(0,88,188,0.24)] hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all duration-200">
                Save changes
            </button>
</section>
</main>
</body></html>
