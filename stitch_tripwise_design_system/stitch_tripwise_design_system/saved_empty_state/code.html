<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pb-24">
<!-- Top App Bar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md fixed top-0 w-full z-50 shadow-sm dark:shadow-none flex justify-between items-center px-lg h-16">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display text-display text-primary dark:text-primary-fixed-dim">TripWise</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content - Empty State -->
<main class="flex-grow flex flex-col items-center justify-center px-xl pt-24 pb-3xl">
<div class="flex flex-col items-center text-center max-w-sm w-full animate-fade-in-up">
<!-- Illustration Container -->
<div class="relative w-48 h-48 mb-3xl flex items-center justify-center">
<!-- Background decorative elements -->
<div class="absolute inset-0 bg-surface-container-low rounded-full scale-110 opacity-50 blur-xl"></div>
<div class="absolute inset-4 bg-surface-container rounded-full opacity-80"></div>
<!-- Icons Stack -->
<div class="relative flex items-center justify-center z-10 text-outline-variant">
<span class="material-symbols-outlined text-[100px] opacity-20" data-icon="bookmark">bookmark</span>
<div class="absolute -right-2 -bottom-2 bg-background rounded-full p-2 shadow-sm">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
</div>
<!-- Text Content -->
<h2 class="font-title-lg text-title-lg text-on-surface mb-md">No saved places yet</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-2xl max-w-[280px]">
                Save places you like and find them here later.
            </p>
<!-- CTA -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-3 px-xl rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-95 duration-200 shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
                Explore places
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="bg-surface dark:bg-surface-dim font-label-md text-label-md fixed bottom-0 w-full rounded-t-xl z-50 shadow-[0_-4px_8px_rgba(0,0,0,0.08)] dark:border-t dark:border-outline-variant left-0 flex justify-around items-center pt-sm pb-safe px-md h-20 md:hidden">
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-container transition-all active:scale-90 duration-200 p-2 min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="explore">explore</span>
<span>Explore</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-container transition-all active:scale-90 duration-200 p-2 min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="map">map</span>
<span>Trips</span>
</button>
<!-- Active Tab -->
<button class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-full px-4 py-1 hover:text-primary-container transition-all active:scale-90 duration-200 min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="bookmark" style="font-variation-settings: 'FILL' 1;">bookmark</span>
<span>Saved</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-container transition-all active:scale-90 duration-200 p-2 min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span>Profile</span>
</button>
</nav>
<!-- Desktop Navigation (Hidden on mobile) -->
<nav class="hidden md:flex fixed left-0 top-16 h-full w-64 bg-surface dark:bg-surface-dim border-r border-outline-variant flex-col py-lg px-md gap-sm z-40">

</button>
<button class="flex items-center gap-md text-secondary hover:bg-surface-container-high rounded-full px-lg py-md transition-colors w-full text-left font-label-lg text-label-lg">

<span>Profile</span>
</button>
