<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TripWise - Language</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#d8e4f2",
                        "on-tertiary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fcf9f8",
                        "secondary-fixed-dim": "#bcc8d5",
                        "surface-tint": "#005bc1",
                        "on-primary": "#ffffff",
                        "secondary": "#54606b",
                        "tertiary-fixed": "#ffdad5",
                        "outline-variant": "#c1c6d7",
                        "inverse-on-surface": "#f3f0ef",
                        "primary": "#0058bc",
                        "error": "#ba1a1a",
                        "secondary-container": "#d8e4f2",
                        "surface-container": "#f0eded",
                        "surface": "#fcf9f8",
                        "tertiary-container": "#e2241f",
                        "inverse-surface": "#313030",
                        "on-primary-fixed-variant": "#004493",
                        "surface-variant": "#e5e2e1",
                        "outline": "#717786",
                        "surface-container-high": "#eae7e7",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#5a6671",
                        "surface-container-low": "#f6f3f2",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "tertiary": "#bc000a",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#3d4853",
                        "on-background": "#1c1b1b",
                        "on-surface-variant": "#414755",
                        "on-primary-container": "#fefcff",
                        "background": "#fcf9f8",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#410001",
                        "on-secondary-fixed": "#111d26",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed": "#d8e2ff",
                        "primary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "primary-container": "#0070eb",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "on-tertiary-fixed-variant": "#930005",
                        "on-surface": "#1c1b1b",
                        "inverse-primary": "#adc6ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "16px",
                        "sm": "8px",
                        "3xl": "32px",
                        "2xl": "24px",
                        "xl": "20px",
                        "md": "12px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "title-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "caption": ["Inter"],
                        "title-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "title-sm": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["11px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md text-primary font-title-lg text-title-lg shadow-sm flex justify-between items-center px-lg h-16">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-title-lg text-title-lg text-on-surface">Language</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 pt-24 px-lg pb-safe">
<div class="max-w-2xl mx-auto">
<p class="font-body-md text-body-md text-on-surface-variant mb-lg px-xs">
                Select your preferred language for the TripWise application.
            </p>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] overflow-hidden">
<!-- English Option (Selected) -->
<label class="flex items-center justify-between p-lg border-b border-outline-variant/30 cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<span class="font-title-md text-title-md text-on-surface">English</span>
<span class="font-body-sm text-body-sm text-on-surface-variant bg-surface-container-high px-2 py-1 rounded-full">Default</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center bg-primary">
<span class="material-symbols-outlined text-[16px] text-on-primary" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<input checked="" class="hidden" name="language" type="radio" value="english">
</label>
<!-- Vietnamese Option -->
<label class="flex items-center justify-between p-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<span class="font-body-lg text-body-lg text-on-surface">Vietnamese</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary transition-colors">
<!-- Unselected state, empty circle -->
</div>
<input class="hidden" name="language" type="radio" value="vietnamese">
</label>
</div>
</div>
</main>
</body></html>
