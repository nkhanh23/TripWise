<!DOCTYPE html><html class="light" lang="en"><head>

                      "on-primary-fixed": "#001a41",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",

              "spacing": {

<style>
        .map-bg {
            background-image: radial-gradient(#c1c6d7 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-surface relative overflow-hidden">
<!-- Decorative Map Background Pattern -->
<div class="absolute inset-0 map-bg opacity-30 z-0"></div>
<div class="w-full max-w-md px-lg z-10 relative">
<!-- Top App Bar - Simple version for transactional screen -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-lg h-16 w-full">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors text-primary active:scale-95 duration-150" onclick="window.history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
</header>
<!-- Main Content Card -->
<main class="bg-surface rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.08)] p-2xl w-full relative z-10">
<div class="block transition-opacity duration-300" id="reset-form-state">
<div class="mb-3xl text-center">
<span class="material-symbols-outlined text-4xl text-primary mb-md" data-icon="lock_reset" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
<h1 class="font-display text-display text-on-surface mb-sm">Reset password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email and we'll send you instructions to reset your password.</p>
</div>
<form class="space-y-xl" onsubmit="handleFormSubmit(event)">
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full bg-surface-variant text-on-surface placeholder-on-surface-variant rounded-lg border-0 py-3 pl-10 pr-4 focus:ring-2 focus:ring-primary focus:bg-surface transition-colors font-body-md text-body-md" id="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg rounded-full py-3 hover:opacity-90 active:scale-95 transition-all shadow-sm" type="submit">
                        Send reset link
                    </button>
</form>
</div>
<!-- Success State (Initially Hidden) -->
<div class="hidden text-center transition-opacity duration-300" id="success-state">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mx-auto mb-xl">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<h1 class="font-display text-display text-on-surface mb-sm">Check your email</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-3xl">We sent password reset instructions to your email.</p>
<button class="w-full bg-surface-container-high text-on-surface font-label-lg text-label-lg rounded-full py-3 hover:bg-surface-variant active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2" onclick="resetForm()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
                    Back to sign in
                </button>
</div>
</main>
<!-- Bottom branding -->
<div class="mt-xl text-center">
<span class="font-display text-[24px] font-bold text-primary tracking-tight">TripWise</span>
</div>
</div>
<script>
        function handleFormSubmit(e) {
            e.preventDefault();
            
            // Simple animation sequence
            const formState = document.getElementById('reset-form-state');
            const successState = document.getElementById('success-state');
            
            formState.style.opacity = '0';
            
            setTimeout(() => {
                formState.classList.add('hidden');
                successState.classList.remove('hidden');
                
                // Small delay to allow display:block to apply before animating opacity
                setTimeout(() => {
                    successState.style.opacity = '1';
                }, 50);
            }, 300);
        }

        function resetForm() {
            const formState = document.getElementById('reset-form-state');
            const successState = document.getElementById('success-state');
            const emailInput = document.getElementById('email');
            
            successState.style.opacity = '0';
            
            setTimeout(() => {
                successState.classList.add('hidden');
                formState.classList.remove('hidden');
                emailInput.value = ''; // clear input
                
                setTimeout(() => {
                    formState.style.opacity = '1';
                }, 50);
            }, 300);
        }
    </script>
</body></html>
