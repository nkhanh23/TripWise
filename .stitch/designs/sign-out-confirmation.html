<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        
        /* Bottom Sheet Animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

<body class="bg-background text-on-background font-body-lg min-h-screen relative overflow-hidden flex flex-col antialiased">
<!-- Mock Background Content (Profile Screen) -->
<div class="absolute inset-0 z-0 flex flex-col pointer-events-none opacity-40 filter blur-[2px]">
<!-- Mock Top App Bar -->
<header class="bg-surface/80 backdrop-blur-md text-primary font-title-lg shadow-sm fixed top-0 w-full z-10 flex justify-between items-center px-lg h-16 pt-safe">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-display text-display text-primary tracking-tight">Profile</h1>
<div class="w-10 h-10"></div> <!-- spacer -->
</header>
<!-- Mock Content Area -->
<main class="flex-1 mt-16 px-lg py-xl flex flex-col gap-lg">
<!-- Profile Header -->
<div class="flex items-center gap-lg">
<div class="w-20 h-20 rounded-full bg-surface-container overflow-hidden">
<img alt="Profile avatar" class="w-full h-full object-cover" data-alt="A close-up portrait of a professional modern traveler in a brightly lit, high-end airport lounge. The lighting is soft and cinematic, casting gentle highlights on their face, creating a clean, bright, and approachable look. The background is a soft blur of modern architectural elements in muted neutral tones, typical of a modern travel app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAd1QQlicrOWKmQugS2db0SX0IJQb5cCGiceZ0gPCYJ-CWzve1PU_qcn7-ZKL9YL70N36a-wXfpc1F07pHMX-1rZhPqKksoy2kpavldmhbjLbl1eO3CNwjsx2HdD14bOE3H1B-sTY8fgYX6a3l7NKabDsO0J7dZxXvkyTKK7l7r8vmD_INJeJHpHr1cccKa24PlqSnSsp7P0nxrDv5ZOMLogOyqn5or9FYpbSwkcMzmlF2XJ2aTm4ChFw">
</div>
<div>
<h2 class="font-title-lg text-title-lg">Alex Traveler</h2>
<p class="font-body-md text-body-md text-secondary">Pro Explorer</p>
</div>
</div>
<!-- Settings List Mock -->
<div class="bg-surface-container-low rounded-xl p-md flex flex-col gap-xs mt-xl">
<div class="flex items-center gap-md p-sm">
<span class="material-symbols-outlined text-secondary">person</span>
<span class="font-body-lg text-body-lg flex-1">Personal Info</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
<div class="h-px bg-outline-variant/30 w-full"></div>
<div class="flex items-center gap-md p-sm">
<span class="material-symbols-outlined text-secondary">notifications</span>
<span class="font-body-lg text-body-lg flex-1">Notifications</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
<div class="h-px bg-outline-variant/30 w-full"></div>
<div class="flex items-center gap-md p-sm text-error">
<span class="material-symbols-outlined">logout</span>
<span class="font-body-lg text-body-lg flex-1">Sign Out</span>
</div>
</div>
</main>
<!-- Shared Component: BottomNavBar (Suppressed due to sub-page context, but visible in background mockup for realism if this were a top-level tab) -->
</div>
<!-- Active Overlay (Dimming Background) -->
<div aria-hidden="true" class="absolute inset-0 bg-on-background/30 backdrop-blur-[1px] z-40 animate-fade-in"></div>
<!-- Bottom Sheet Container -->
<div class="absolute bottom-0 w-full z-50 flex flex-col justify-end animate-slide-up">
<!-- Sheet Content Surface -->
<div class="bg-surface w-full rounded-t-[24px] shadow-[0_-8px_16px_rgba(0,0,0,0.08)] pb-safe relative">
<!-- Grabber Handle -->
<div class="w-full flex justify-center pt-md pb-xs">
<div class="w-10 h-1 bg-outline-variant/50 rounded-full"></div>
</div>
<!-- Header / Title -->
<div class="px-lg pt-sm pb-md text-center">
<h2 class="font-title-lg text-title-lg text-on-surface mb-xs">Sign out?</h2>
<p class="font-body-md text-body-md text-secondary">You can sign back in anytime.</p>
</div>
<!-- Actions Area -->
<div class="px-lg pb-xl pt-sm flex flex-col gap-md">
<!-- Primary Destructive Action -->
<button class="w-full bg-error hover:bg-error/90 active:scale-[0.98] transition-all duration-200 text-on-error font-label-lg text-label-lg py-md px-xl rounded-full flex justify-center items-center gap-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">logout</span>
                    Sign out
                </button>
<!-- Secondary / Cancel Action -->
<button class="w-full bg-surface-container-low hover:bg-surface-container active:scale-[0.98] transition-all duration-200 text-on-surface font-label-lg text-label-lg py-md px-xl rounded-full flex justify-center items-center">
                    Cancel
                </button>
