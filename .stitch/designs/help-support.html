<!DOCTYPE html><html class="light" lang="en"><head>

<body class="bg-background text-on-background min-h-screen font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-sm dark:shadow-none fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-lg h-16 w-full max-w-2xl mx-auto">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed-dim flex-1 text-center">Help &amp; Support</h1>
<div class="w-10"></div> <!-- Spacer to balance flex layout -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-[80px] pb-3xl px-lg max-w-2xl mx-auto min-h-screen flex flex-col gap-2xl">
<!-- Search Bar (Bonus element for better UX in help sections) -->
<section class="mt-lg">
<div class="relative w-full rounded-full bg-surface-variant focus-within:ring-2 focus-within:ring-primary transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-lg flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="w-full bg-transparent border-none py-md pl-[48px] pr-lg font-body-lg text-on-surface focus:ring-0 rounded-full placeholder:text-on-surface-variant" placeholder="Search for help..." type="text">
</div>
</section>
<!-- Help Categories List -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-lg text-label-lg text-secondary px-sm mb-xs uppercase tracking-wider">Common Topics</h2>
<ul class="flex flex-col">
<li>
<a class="flex justify-between items-center py-xl px-md border-b border-surface-variant hover:bg-surface-container-low transition-colors rounded-lg active:scale-[0.99] duration-150 group" href="#">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Frequently asked questions</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</a>
</li>
<li>
<a class="flex justify-between items-center py-xl px-md border-b border-surface-variant hover:bg-surface-container-low transition-colors rounded-lg active:scale-[0.99] duration-150 group" href="#">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Contact support</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</a>
</li>
<li>
<a class="flex justify-between items-center py-xl px-md border-b border-surface-variant hover:bg-surface-container-low transition-colors rounded-lg active:scale-[0.99] duration-150 group" href="#">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Report a problem</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</a>
</li>
</ul>
</section>
<!-- Legal & Policies List -->
<section class="flex flex-col gap-sm mt-xl">
<h2 class="font-label-lg text-label-lg text-secondary px-sm mb-xs uppercase tracking-wider">Legal</h2>
<ul class="flex flex-col">
<li>
<a class="flex justify-between items-center py-xl px-md border-b border-surface-variant hover:bg-surface-container-low transition-colors rounded-lg active:scale-[0.99] duration-150 group" href="#">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Privacy Policy</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</a>
</li>
<li>
<a class="flex justify-between items-center py-xl px-md hover:bg-surface-container-low transition-colors rounded-lg active:scale-[0.99] duration-150 group" href="#">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Terms of Service</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</a>
</li>
</ul>
</section>
<!-- Contextual Illustration Canvas Area (Minimal, Map-inspired) -->
<div class="mt-auto pt-3xl flex justify-center items-center opacity-30">
<div class="w-32 h-32 rounded-full border-2 border-dashed border-outline-variant flex items-center justify-center bg-surface-container">
<span class="material-symbols-outlined text-[48px] text-outline" style="font-variation-settings: 'wght' 200;">support_agent</span>
</div>
</div>
